<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gwolf Status — Live System Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23cee800%22/></svg>">
<style>
:root{
  --bg:#0b0b0f; --card:#13131a; --card-border:#23232e;
  --text:#ededed; --muted:#8e8e99; --up:#cee800; --down:#f55393; --warn:#ff8f1c;
  --purple:#765bb7; --violet:#8626c3;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.container{max-width:800px;margin:0 auto;padding:36px 16px}
header{
  display:flex; justify-content:space-between; align-items:center;
  padding-bottom:20px; margin-bottom:24px; border-bottom:1px solid var(--card-border);
}
.logo{font-size:16px; font-weight:700; letter-spacing:-0.3px}
.logo span{color:var(--muted); font-weight:400; font-size:12px}
.host-badge{
  font-size:11px; padding:4px 10px; border-radius:20px;
  background:rgba(255,255,255,0.03); border:1px solid var(--card-border); color:var(--muted);
}

/* Banner Status Global */
.banner{
  padding:16px 20px; border-radius:12px; margin-bottom:24px;
  display:flex; align-items:center; gap:12px; font-weight:600; font-size:14px;
  transition:all 0.3s;
}
.banner.all-up{
  background:rgba(206,232,0,0.08); border:1px solid rgba(206,232,0,0.25); color:var(--up);
}
.banner.has-down{
  background:rgba(245,83,147,0.08); border:1px solid rgba(245,83,147,0.25); color:var(--down);
}
.pulse{
  width:10px; height:10px; border-radius:50%; background:currentColor;
  box-shadow:0 0 10px currentColor; animation:pulse-anim 2s infinite ease-in-out;
}
@keyframes pulse-anim{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:0.4;transform:scale(0.85)}
}

/* Telemetry Widgets Grid */
.telemetry-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px;
  margin-bottom:32px;
}
.tel-card{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px;
}
.tel-title{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:600}
.tel-val{font-size:16px; font-weight:700}
.tel-sub{font-size:11px; color:var(--muted)}
.tel-bar-bg{height:4px; background:var(--card-border); border-radius:2px; margin-top:4px; overflow:hidden}
.tel-bar-fg{height:100%; background:var(--purple); border-radius:2px; transition:width 0.3s}
.tel-bar-fg.high{background:var(--warn)}
.tel-bar-fg.critical{background:var(--down)}

/* List of Services */
.section-title{
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:0.8px; color:var(--muted); margin-bottom:12px;
}
.service-list{display:flex; flex-direction:column; gap:10px}
.service-item{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:12px; padding:16px; transition:border-color 0.15s;
}
.service-item:hover{border-color:#33333a}
.service-header{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
}
.service-name{font-weight:600; font-size:13px; color:#fff}
.service-meta{display:flex; align-items:center; gap:14px; font-size:11px}
.badge-status{
  font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:6px;
}
.badge-status.up{background:rgba(206,232,0,0.15); color:var(--up)}
.badge-status.down{background:rgba(245,83,147,0.15); color:var(--down)}
.latency{color:var(--muted); font-family:monospace}
.uptime-pct{font-weight:600; color:#fff}

/* Bars Chart */
.bars-track{
  display:flex; gap:3px; height:24px; align-items:flex-end;
  background:rgba(255,255,255,0.015); padding:3px; border-radius:6px;
}
.bar{
  flex:1; height:100%; border-radius:2px; min-width:3px;
  background:var(--up); opacity:0.85; transition:opacity 0.2s;
}
.bar:hover{opacity:1}
.bar.down{background:var(--down)}
.bar-footer{
  display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:6px;
}

footer{
  margin-top:36px; padding-top:16px; border-top:1px solid var(--card-border);
  display:flex; justify-content:space-between; font-size:11px; color:var(--muted);
}

@media(max-width:500px){
  .telemetry-grid{grid-template-columns:1fr 1fr}
  .service-meta{gap:8px}
  .uptime-pct{display:none}
}

/* Top Procs Card */
.procs-card{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:12px; padding:16px; margin-bottom:32px;
}
.procs-header{
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
}
.btn-purge{
  background:rgba(245,83,147,0.12); color:var(--down); border:1px solid rgba(245,83,147,0.3);
  padding:5px 12px; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer;
  transition:all 0.2s;
}
.btn-purge:hover{background:rgba(245,83,147,0.25)}
.proc-row{
  display:flex; justify-content:space-between; align-items:center; padding:6px 0;
  border-bottom:1px solid rgba(255,255,255,0.03); font-size:12px;
}
.proc-row:last-child{border-bottom:none}
.proc-meta{display:flex; gap:12px; font-family:monospace; font-size:11px; color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">⚡ Gwolf <span>Status</span></div>
    <div class="host-badge">Termux ARM64 • Snapdragon 665</div>
  </header>

  <div class="banner all-up" id="statusBanner">
    <div class="pulse"></div>
    <span id="bannerText">Checking system status...</span>
  </div>

  <div class="telemetry-grid" id="telemetryGrid" style="display:none">
    <div class="tel-card">
      <div class="tel-title">🌡️ Thermal</div>
      <div class="tel-val" id="telTemp">-</div>
      <div class="tel-sub">Device Temp</div>
    </div>
    <div class="tel-card">
      <div class="tel-title">🧠 RAM</div>
      <div class="tel-val" id="telRam">-</div>
      <div class="tel-sub" id="telRamSub">-</div>
      <div class="tel-bar-bg"><div class="tel-bar-fg" id="telRamBar" style="width:0%"></div></div>
    </div>
    <div class="tel-card">
      <div class="tel-title">🔄 Swap</div>
      <div class="tel-val" id="telSwap">-</div>
      <div class="tel-sub" id="telSwapSub">-</div>
      <div class="tel-bar-bg"><div class="tel-bar-fg" id="telSwapBar" style="width:0%"></div></div>
    </div>
    <div class="tel-card">
      <div class="tel-title">💾 Disk</div>
      <div class="tel-val" id="telDisk">-</div>
      <div class="tel-sub" id="telDiskSub">-</div>
      <div class="tel-bar-bg"><div class="tel-bar-fg" id="telDiskBar" style="width:0%"></div></div>
    </div>
    <div class="tel-card">
      <div class="tel-title">🌐 Tunnel</div>
      <div class="tel-val" id="telCf" style="color:var(--up)">-</div>
      <div class="tel-sub">Cloudflared Edge</div>
    </div>
    <div class="tel-card">
      <div class="tel-title">🛡️ Supervisor</div>
      <div class="tel-val" id="telSup" style="color:var(--up)">-</div>
      <div class="tel-sub">Runsv Engine</div>
    </div>
  </div>

  <div class="procs-card" id="procsContainer" style="display:none">
    <div class="procs-header">
      <div class="section-title" style="margin-bottom:0">⚙️ Top 5 Proses Terberat</div>
      <button class="btn-purge" onclick="killZombies(event)">🧹 Sapu Orphan & Zombie</button>
    </div>
    <div id="procsList"></div>
  </div>

  <div class="section-title">Layanan & Infrastruktur</div>
  <div class="service-list" id="servicesContainer">
    <!-- Di-generate otomatis via JS -->
  </div>

  <footer>
    <div>Auto-refresh setiap 30 detik</div>
    <div id="lastUpdated">-</div>
  </footer>
</div>

<script>
function colorizeBar(el, pct) {
  el.style.width = pct + '%';
  el.className = 'tel-bar-fg';
  if(pct > 85) el.classList.add('critical');
  else if(pct > 70) el.classList.add('high');
}

async function refreshStatus(){
  try{
    const res = await fetch('/api/status');
    const data = await res.json();
    
    // Banner
    const banner = document.getElementById('statusBanner');
    const bText = document.getElementById('bannerText');
    if(data.all_systems_operational){
      banner.className = 'banner all-up';
      bText.innerText = 'Semua Sistem & Layanan Berjalan Normal';
    } else {
      banner.className = 'banner has-down';
      bText.innerText = 'Sebagian Layanan Mengalami Gangguan';
    }

    // Telemetry
    if(data.system){
      document.getElementById('telemetryGrid').style.display = 'grid';
      const sys = data.system;
      
      document.getElementById('telTemp').innerText = sys.temp_c > 0 ? sys.temp_c + ' °C' : 'N/A';
      
      document.getElementById('telRam').innerText = (sys.ram.used_mb/1024).toFixed(1) + ' GB';
      document.getElementById('telRamSub').innerText = sys.ram.pct + '% / ' + (sys.ram.total_mb/1024).toFixed(1) + ' GB';
      colorizeBar(document.getElementById('telRamBar'), sys.ram.pct);
      
      document.getElementById('telSwap').innerText = (sys.swap.used_mb/1024).toFixed(1) + ' GB';
      document.getElementById('telSwapSub').innerText = sys.swap.pct + '% / ' + (sys.swap.total_mb/1024).toFixed(1) + ' GB';
      colorizeBar(document.getElementById('telSwapBar'), sys.swap.pct);
      
      document.getElementById('telDisk').innerText = sys.disk.free_gb + ' GB';
      document.getElementById('telDiskSub').innerText = 'Free / ' + sys.disk.total_gb + ' GB';
      colorizeBar(document.getElementById('telDiskBar'), sys.disk.pct);

      const cfEl = document.getElementById('telCf');
      if(sys.cloudflared_running){
        cfEl.innerText = 'Active';
        cfEl.style.color = 'var(--up)';
      } else {
        cfEl.innerText = 'Offline';
        cfEl.style.color = 'var(--down)';
      }

      const supEl = document.getElementById('telSup');
      if(supEl){
        if(sys.supervisor_running){
          supEl.innerText = 'Active';
          supEl.style.color = 'var(--up)';
        } else {
          supEl.innerText = 'CRASHED';
          supEl.style.color = 'var(--down)';
        }
      }

      // Top Procs
      if(sys.top_procs && sys.top_procs.length > 0){
        document.getElementById('procsContainer').style.display = 'block';
        const pl = document.getElementById('procsList');
        pl.innerHTML = '';
        sys.top_procs.forEach(p => {
          const row = document.createElement('div');
          row.className = 'proc-row';
          row.innerHTML = `
            <div>
              <span style="font-weight:600;color:#fff">${p.name}</span>
              <span style="color:var(--muted);font-size:11px;margin-left:6px">PID: ${p.pid}</span>
            </div>
            <div class="proc-meta">
              <span>RAM: ${p.mem}%</span>
              <span>CPU: ${p.cpu}%</span>
            </div>
          `;
          pl.appendChild(row);
        });
      }
    }

    // List
    const container = document.getElementById('servicesContainer');
    container.innerHTML = '';

    data.services.forEach(s => {
      const isUp = s.current_status === 'up';
      const statusBadge = isUp 
        ? '<span class="badge-status up">Operasional</span>' 
        : '<span class="badge-status down">Offline</span>';

      // Bars
      let barsHtml = '';
      const totalBars = 40;
      const historyBars = s.bars || [];
      const paddingCount = Math.max(0, totalBars - historyBars.length);

      for(let i=0; i<paddingCount; i++){
        barsHtml += '<div class="bar" title="No Data"></div>';
      }
      historyBars.slice(-totalBars).forEach(st => {
        barsHtml += `<div class="bar ${st === 'down' ? 'down' : ''}" title="${st === 'up' ? 'Operasional' : 'Offline'}"></div>`;
      });

      const card = document.createElement('div');
      card.className = 'service-item';
      card.innerHTML = `
        <div class="service-header">
          <div>
            <div class="service-name">${s.name}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${s.public_url}</div>
          </div>
          <div class="service-meta">
            <span class="latency">${s.latency_ms > 0 ? s.latency_ms + 'ms' : '-'}</span>
            <span class="uptime-pct">${s.uptime_pct}%</span>
            ${statusBadge}
          </div>
        </div>
        <div class="bars-track">
          ${barsHtml}
        </div>
        <div class="bar-footer">
          <span>Pemeriksaan Terakhir</span>
          <span>Sekarang</span>
        </div>
      `;
      container.appendChild(card);
    });

    const d = new Date();
    document.getElementById('lastUpdated').innerText = 'Terakhir dicek: ' + d.toLocaleTimeString('id-ID');
  }catch(err){
    console.error('Fetch status error:', err);
  }
}

async function killZombies(e){
  const btn = e.target;
  const oldText = btn.innerText;
  btn.innerText = 'Menyapu...';
  btn.disabled = true;
  try{
    const res = await fetch('/api/kill-zombies', {method:'POST'});
    const data = await res.json();
    if(data.killed && data.killed.length > 0){
      alert(`Berhasil membersihkan ${data.killed.length} orphan/zombie liar: PID ${data.killed.join(', ')}`);
    } else {
      alert('Sistem bersih! Tidak ada proses orphan/zombie liar (PPID 1).');
    }
    refreshStatus();
  }catch(err){
    alert('Gagal membersihkan zombie: ' + err);
  }finally{
    btn.innerText = oldText;
    btn.disabled = false;
  }
}

refreshStatus();
setInterval(refreshStatus, 30000);
</script>
</body>
</html>
